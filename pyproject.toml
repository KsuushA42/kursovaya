[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "readability-navigation-coursework"
version = "0.1.0"
description = "Учебный проект: читаемость и сопровождаемость кода"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "examples/before_format.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
